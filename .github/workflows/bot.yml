name: WoW Forever news → Telegram

# Il bot resta acceso ~5h30 per esecuzione: pubblica, aspetta 20 minuti, ripete.
# Alla fine avvia da solo l'esecuzione successiva, così la catena non si ferma.
# Per avviarlo: Actions → Run workflow (una volta). Per fermarlo: "Cancel run" sull'esecuzione in corso.
# Lo schedule resta come riserva: riavvia la catena se si fosse interrotta.

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # salvare seen.json
  actions: write    # riavviare il workflow alla fine del ciclo

concurrency:
  group: news-bot
  cancel-in-progress: false

env:
  INTERVAL_MIN: 20        # minuti tra un controllo e l'altro
  RUN_FOR_MIN: 330        # quanto resta acceso ogni esecuzione (limite GitHub: 360)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # sempre il codice e lo stato più recenti, anche con "Re-run"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pubblica le news (ogni ${{ env.INTERVAL_MIN }} minuti)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TRANSLATE_TO: ${{ vars.TRANSLATE_TO || 'off' }}
          BLUE_POSTS: ${{ vars.BLUE_POSTS || 'on' }}
          SILENT: ${{ vars.SILENT || 'on' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + RUN_FOR_MIN * 60 ))
          while :; do
            echo "::group::Controllo delle $(date -u +%H:%M) UTC"
            git pull -q --rebase origin main || echo "::warning::Aggiornamento dal repo non riuscito"
            python bot.py || echo "::warning::Questo giro non è andato a buon fine, riprovo al prossimo"
            if [ -f seen.json ]; then
              git add seen.json
              if ! git diff --cached --quiet; then
                git commit -q -m "Aggiorna news pubblicate [skip ci]"
                git pull -q --rebase origin main && git push -q || echo "::warning::Salvataggio dello stato non riuscito"
              fi
            fi
            echo "::endgroup::"
            next=$(( $(date +%s) + INTERVAL_MIN * 60 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( INTERVAL_MIN * 60 ))
          done

      - name: Avvia l'esecuzione successiva
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
