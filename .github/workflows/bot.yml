name: WoW Forever news → Telegram

on:
  schedule:
    - cron: "7,27,47 * * * *"   # ogni 20 minuti (minuti meno affollati di :00/:20/:40)
  workflow_dispatch:          # avvio manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pubblica le news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TRANSLATE_TO: ${{ vars.TRANSLATE_TO || 'off' }}
          BLUE_POSTS: ${{ vars.BLUE_POSTS || 'on' }}
          SILENT: ${{ vars.SILENT || 'on' }}
        run: python bot.py
      - name: Salva lo stato (news già pubblicate)
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Aggiorna news pubblicate [skip ci]" && git push)
